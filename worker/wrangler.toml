name = "netgulf-proxy"
main = "index.js"
compatibility_date = "2024-01-01"

[vars]
# Comma-separated list of browser origins allowed to call the proxy.
ALLOWED_ORIGINS = ""

# Set as encrypted secrets (Cloudflare dashboard → Workers → Settings → Variables,
# or `wrangler secret put <NAME>`), never in this file:
#   ANTHROPIC_API_KEY — upstream Anthropic key
#   PROXY_AUTH_TOKEN  — shared token every caller must send as `Authorization: Bearer <token>`
