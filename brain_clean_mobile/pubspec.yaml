name: brain_clean_mobile
description: "A neuro-scientific digital detox mobile app — Brain Clean."
publish_to: 'none'
version: 1.2.0+12

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  supabase_flutter: ^2.5.0
  go_router: ^14.0.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  fl_chart: ^0.68.0
  flutter_local_notifications: ^17.0.0
  intl: ">=0.19.0 <0.21.0"
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  audioplayers: ^6.1.0
  confetti: ^0.7.0
  share_plus: ^10.0.0
  timezone: ^0.9.4
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  flutter_jailbreak_detection: ^1.10.0
  crypto: ^3.0.6
  uuid: ^4.5.1
  http: ^1.2.2
  purchases_flutter: ^10.4.0
  purchases_ui_flutter: ^10.4.0
  google_mobile_ads: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/brain_clean_icon_512.png"
  adaptive_icon_background: "#0D1117"
  adaptive_icon_foreground: "assets/icons/brain_clean_icon_512.png"
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true
  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Light.ttf
          weight: 300
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
  assets:
    - .env.example
    - assets/fonts/
    - assets/sounds/rain.mp3
    - assets/sounds/waves.mp3
    - assets/sounds/forest.mp3
    - assets/sounds/white_noise.mp3
    - assets/sounds/brown_noise.mp3
