# Keep JVM heap modest so release builds don't OOM on typical developer machines.
# (Previous 8G heap + 4G metaspace caused Gradle daemon native OOM.)
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
# Workspace path may include non-ASCII segments on Windows (e.g. Arabic folder names).
android.overridePathCheck=true
kotlin.compiler.execution.strategy=in-process
